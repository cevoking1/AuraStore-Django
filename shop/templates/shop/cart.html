{% extends 'base.html' %}

{% block title %}Корзина | Aura Store{% endblock %}

{% block content %}
<main class="max-w-4xl mx-auto py-20 px-6">
    <h1 class="text-6xl font-extrabold tracking-tighter mb-16">Ваша <span class="text-gray-300">корзина.</span></h1>

    {% if cart_items %}
        <div class="bg-white rounded-[3.5rem] p-12 apple-shadow border border-gray-50 space-y-10">
            ...
            <a href="{% url 'checkout' %}" class="aura-gradient text-white px-16 py-6 rounded-full font-bold text-lg text-center block">
                Оформить заказ
            </a>
        </div>
    {% else %}
        <div class="text-center py-32 bg-white rounded-[4rem] border border-gray-50">
            <p class="text-gray-300 text-2xl font-medium">В корзине пока пусто ✨</p>
        </div>
    {% endif %}
</main>
{% endblock %}

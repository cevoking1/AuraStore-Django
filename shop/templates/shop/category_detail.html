{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="bg-[#f5f5f7] min-h-screen pt-32 pb-20">
    <div class="max-w-7xl mx-auto px-12">
        <h1 class="text-7xl font-bold tracking-tight text-black mb-20">{{ category.name }}.</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            {% for product in products %}
            <div class="group bg-white rounded-[2rem] p-12 h-[35rem] flex flex-col justify-between hover:bg-gray-50 cursor-pointer shadow-sm transition-all border border-transparent hover:border-gray-100">
                
                <div class="space-y-2">
                    <p class="text-[13px] font-bold text-[#b64400] uppercase tracking-wider">Aura Store</p>
                    <p class="text-2xl font-bold text-black tracking-tight leading-tight">{{ product.name }}</p>
                </div>

                <a href="{% url 'product_detail' product.pk %}" class="flex justify-center items-center h-full my-6">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" alt="{{ product.name }}" 
                             class="max-h-60 object-contain mix-blend-multiply opacity-95 group-hover:opacity-100 transition-opacity duration-500">
                    {% endif %}
                </a>

                <div class="space-y-6">
                    <p class="text-xl text-black font-bold">от {{ product.price }} ₸</p>
                    <a href="{% url 'product_detail' product.pk %}" 
                       class="inline-block bg-black text-white px-10 py-4 rounded-full text-[13px] font-bold hover:bg-gray-800 transition-colors w-full text-center tracking-wide">
                        Подробнее
                    </a>
                </div>
            </div>
            {% empty %}
            <div class="col-span-full py-20 text-center">
                <p class="text-2xl text-gray-400 font-medium">В этой категории пока нет товаров.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа | Aura Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .aura-gradient { background: linear-gradient(135deg, #a78bfa 0%, #f472b6 50%, #60a5fa 100%); }
        .aura-text-gradient {
            background: linear-gradient(135deg, #a78bfa 0%, #f472b6 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#fafafc] flex items-center justify-center min-h-screen p-6">

    <div class="max-w-xl w-full bg-white p-10 md:p-12 rounded-[3rem] shadow-sm border border-gray-50 text-center">
        <div class="mb-10">
            <h1 class="text-4xl font-extrabold tracking-tighter mb-4">Данные <span class="aura-text-gradient">доставки.</span></h1>
            <p class="text-gray-400 font-medium tracking-tight">Заполните форму, чтобы мы отправили вашу Aura</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4">
                <input type="text" name="first_name" placeholder="Имя" required 
                    class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-purple-100 transition-all font-medium">
                <input type="text" name="last_name" placeholder="Фамилия" required 
                    class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-purple-100 transition-all font-medium">
            </div>
            
            <input type="text" name="phone" placeholder="Телефон" required 
                class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-purple-100 transition-all font-medium">
            
            <input type="text" name="address" placeholder="Адрес доставки (г. Алматы, ул...)" required 
                class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-purple-100 transition-all font-medium">

            <button type="submit" class="w-full aura-gradient text-white py-5 mt-6 rounded-full font-bold text-lg hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-purple-100">
                Подтвердить заказ
            </button>
        </form>

        <a href="{% url 'cart_detail' %}" class="block mt-8 text-[11px] font-black text-gray-300 uppercase tracking-widest hover:text-black transition">
            ← Вернуться в корзину
        </a>
    </div>

</body>
</html>

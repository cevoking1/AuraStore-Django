{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="bg-[#f5f5f7] min-h-screen flex items-center justify-center py-20 px-6">
    <div class="max-w-md w-full">
        
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold tracking-tight text-black mb-4">Вход.</h1>
            <p class="text-lg text-gray-500 font-medium">Войдите в свой Aura ID для управления заказами.</p>
        </div>

        <div class="bg-white rounded-[2.5rem] p-10 sm:p-14 shadow-sm border border-transparent hover:border-gray-100 transition-all">
            <form method="POST" class="aura-form space-y-6">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <button type="submit" class="w-full bg-blue-600 text-white mt-8 py-5 rounded-full text-lg font-bold hover:bg-blue-700 transition-all shadow-xl shadow-blue-100 outline-none">
                    Войти
                </button>
            </form>

            <div class="mt-8 text-center pt-8 border-t border-gray-100">
                <p class="text-[13px] font-bold text-gray-400">
                    Нет аккаунта? 
                    <a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-800 ml-1 transition-colors">Создать Aura ID</a>
                </p>
            </div>
        </div>
        
    </div>
</section>

<style>
    .aura-form p {
        margin-bottom: 1.5rem;
    }
    .aura-form label {
        display: block;
        font-size: 11px;
        font-weight: 900;
        color: #9ca3af;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        margin-left: 1rem;
    }
    .aura-form input[type="text"],
    .aura-form input[type="password"],
    .aura-form input[type="email"] {
        width: 100%;
        background-color: #f5f5f7;
        border: 2px solid transparent;
        border-radius: 1.5rem;
        padding: 1.25rem 1.5rem;
        font-size: 1rem;
        font-weight: 500;
        color: #000;
        outline: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .aura-form input[type="text"]:focus,
    .aura-form input[type="password"]:focus,
    .aura-form input[type="email"]:focus {
        background-color: #ffffff;
        border-color: #2563eb;
        box-shadow: 0 4px 20px rgba(37, 99, 235, 0.1);
    }
    .aura-form .helptext {
        display: block;
        font-size: 11px;
        color: #9ca3af;
        margin-top: 0.5rem;
        margin-left: 1rem;
    }
    .aura-form ul.errorlist {
        color: #ef4444;
        font-size: 12px;
        font-weight: 600;
        margin-top: 0.5rem;
        margin-left: 1rem;
        list-style-type: none;
        padding: 0;
    }
</style>
{% endblock %}

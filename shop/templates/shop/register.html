{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="bg-[#f5f5f7] min-h-screen flex items-center justify-center py-20 px-6">
    <div class="max-w-md w-full">
        
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold tracking-tight text-black mb-4">Создание.</h1>
            <p class="text-lg text-gray-500 font-medium">Создайте Aura ID для покупок и отслеживания заказов.</p>
        </div>

        <div class="bg-white rounded-[2.5rem] p-10 sm:p-14 shadow-sm border border-transparent hover:border-gray-100 transition-all">
            <form method="POST" class="aura-form space-y-4">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <button type="submit" class="w-full bg-blue-600 text-white mt-10 py-5 rounded-full text-lg font-bold hover:bg-blue-700 transition-all shadow-xl shadow-blue-100 outline-none">
                    Создать аккаунт
                </button>
            </form>

            <div class="mt-8 text-center pt-8 border-t border-gray-100">
                <p class="text-[13px] font-bold text-gray-400">
                    Уже есть аккаунт? 
                    <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-800 ml-1 transition-colors">Войти</a>
                </p>
            </div>
        </div>
        
    </div>
</section>

{% endblock %}

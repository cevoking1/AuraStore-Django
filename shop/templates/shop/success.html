{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="bg-[#f5f5f7] min-h-screen flex items-center justify-center py-20 px-6">
    <div class="max-w-md w-full text-center">
        
        <div class="bg-white rounded-[3rem] p-12 sm:p-16 shadow-sm border border-transparent hover:border-gray-100 transition-all">
            <div class="text-7xl mb-8 select-none">✨</div>
            <h1 class="text-4xl font-bold tracking-tight text-black mb-4">Спасибо!</h1>
            <p class="text-lg text-gray-500 font-medium mb-10">Ваш заказ <b class="text-black">№{{ order.id }}</b> успешно оформлен и передан в обработку.</p>
            
            <div class="space-y-4">
                <a href="{% url 'profile' %}" class="block w-full bg-blue-600 text-white py-5 rounded-full text-lg font-bold hover:bg-blue-700 transition-all shadow-xl shadow-blue-100 outline-none">
                    Следить за заказом
                </a>
                <a href="{% url 'index' %}" class="block w-full bg-gray-100 text-black py-5 rounded-full text-lg font-bold hover:bg-gray-200 transition-all outline-none">
                    Вернуться в каталог
                </a>
            </div>
        </div>
        
    </div>
</section>
{% endblock %}

{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="bg-white h-screen flex items-center justify-center text-center">
    <div class="max-w-2xl px-12 space-y-8">
        <div class="flex justify-center">
            <div class="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center">
                <span class="text-5xl">✓</span>
            </div>
        </div>
        <h1 class="text-6xl font-bold tracking-tight text-black">Готово.</h1>
        <p class="text-2xl text-gray-500 font-medium leading-relaxed">
            Ваш заказ №{{ order.id }} принят. Мы отправили детали на вашу почту. 
            Скоро курьер Aura свяжется с вами.
        </p>
        <div class="pt-8">
            <a href="{% url 'index' %}" class="inline-block bg-black text-white px-12 py-5 rounded-full font-bold text-lg hover:bg-gray-800 transition-all">
                Вернуться на главную
            </a>
        </div>
    </div>
</section>
{% endblock %}
